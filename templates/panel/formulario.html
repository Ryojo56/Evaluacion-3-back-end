{% extends 'panel/base.html' %}
{% block title %}{{ titulo }} · Aventuras del Sur{% endblock %}
{% block panel %}
<h1 class="h3 text-gray-900 mb-3">{{ titulo }}</h1>
<div class="card shadow-sm formulario"><div class="card-body">
  {% if objeto %}<p>{{ objeto }}</p>{% endif %}
  <form method="post">
    {% csrf_token %}
    {% include 'campos.html' %}
    <button class="btn btn-primary" type="submit">Guardar</button>
    <a class="btn btn-outline-secondary" href="{% url volver %}">Volver</a>
  </form>
</div></div>
{% endblock %}
