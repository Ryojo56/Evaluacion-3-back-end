{% extends 'base_login.html' %}
{% block title %}Crear cuenta · Aventuras del Sur{% endblock %}
{% block contenido %}
<h1 class="h3 text-gray-900 mb-4">Crear cuenta de turista</h1>
<form method="post">
  {% csrf_token %}
  {% include 'campos.html' %}
  <button class="btn btn-primary btn-block" type="submit">Crear cuenta</button>
</form>
<p class="mt-3 mb-0"><a href="{% url 'login' %}">Volver al inicio de sesión</a></p>
{% endblock %}
